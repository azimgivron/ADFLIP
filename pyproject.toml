[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adflip"
version = "0.1.0"
description = "ADFLIP protein data and model components used by Hessian Flow"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
  { name = "ADFLIP authors" },
]
dependencies = [
  "biopython>=1.84",
  "hydra-core>=1.3",
  "lightning>=2.0",
  "numpy>=1.26",
  "omegaconf>=2.3",
  "pandas>=2.2.3",
  "prody>=2.6.1",
  "requests",
  "scipy>=1.14.1",
  "sortedcontainers>=2.4.0",
  "torch==2.4.1",
  "torch-cluster>=1.6.3",
  "torch-geometric>=2.5.3,<2.8",
  "torchmetrics>=1.0",
  "tqdm>=4.66.5"
]

[tool.uv]
find-links = [
    "https://data.pyg.org/whl/torch-2.4.0+cpu.html",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
adflip-download-data = "adflip.data.download_data:main"
adflip-parse-dataset = "adflip.data.parser_dataset:main"
adflip-export-sequences = "adflip.data.export_parsed_sequences:main"
adflip-build-mmseqs-clusters = "adflip.data.build_mmseqs_clusters:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"adflip.data" = ["misc/*.txt"]
"PIPPack.data" = ["stereo_chemical_props.txt"]
"PIPPack" = ["LICENSE", "model_weights/*.pickle", "model_weights/*.pt"]
